[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-platform"
version = "0.1.0"
description = "RAMP: Regime-Adaptive Multi-Asset Portfolio Research and Execution Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "RAMP Quantitative Research Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "cvxpy>=1.4.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.30",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ramp*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
