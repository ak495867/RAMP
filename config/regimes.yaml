
regimes:
  n_states: 3
  state_names:
    0: "low_vol_expansion"
    1: "high_vol_contraction"
    2: "crisis_liquidity_crunch"

  models:
    online_hmm:
      features:
        - "returns_ew"
        - "volatility_realized"
        - "cross_corr_mean"
      covariance_type: "full"
      n_iter: 100
      random_state: 42
      min_train_bars: 252
      update_frequency: 21
      
    bocpd:
      hazard_rate: 0.01
      prior_mean: 0.0
      prior_var: 1.0
      observation_var: 1.0

  hysteresis:
    confidence_threshold: 0.65
    min_dwell_bars: 3
    dampening_factor: 0.15
